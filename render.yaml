services:
  - type: web
    name: retail-sales-api
    env: python
    plan: free
    rootDir: backend

    buildCommand: |
      pip install -r ../requirements.txt
      pip install email-validator

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        value: sqlite:///./retail.db

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

      - key: DEBUG
        value: "False"